<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111d"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.2)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient Intelligence Glow -->
  <circle cx="256" cy="270" r="140" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <!-- Vertical Pillar -->
  <rect x="136" y="128" width="56" height="256" rx="28" fill="url(#emeraldGrad)"/>

  <!-- Upper Diagonal (Cyan Branch) -->
  <path d="M 216 268 L 336 136 C 347 124 366 124 376 136 C 388 147 388 165 376 176 L 268 298 Z" fill="url(#cyanGrad)"/>

  <!-- Lower Diagonal (Emerald Branch) -->
  <path d="M 232 274 L 336 374 C 347 385 347 403 336 414 C 324 425 306 425 296 414 L 196 316 Z" fill="url(#emeraldGrad)"/>

  <!-- Neural Core Nodes -->
  <circle cx="244" cy="286" r="14" fill="#ffffff" opacity="0.95"/>
  <circle cx="356" cy="156" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="316" cy="394" r="8" fill="#ffffff" opacity="0.8"/>
</svg>
